# The local Supabase stack the database tests run on, here and in CI. Started by supabase/local_up.sh.
# This workdir holds no migrations. migrate.py applies supabase/migrations/ after the stack is up, because two of
# them share the number 0024 and the CLI keys on the number. Every value left out takes the CLI default.
project_id = "latam-trip-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# the same major version as the project
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5198"
# Sign up is open to anyone (task 6.1 of FEAT-006, PROD-009). The live project carries the same.
enable_signup = true

[auth.email]
enable_signup = true
# Confirm email is on, as in the project: a sign up gets no session until the address is confirmed by its email link.
# It must stay on there, because sign up is open at /auth/v1/signup to the public key: with it off a stranger who signs
# up with someone else's address gets a session at once. The trigger of 0036 clears the password a sign up gives, so
# that password never signs in after the owner of the address confirms it. The local stack sends no mail.
enable_confirmations = true

# Supabase Auth asks public.hook_before_user_created before it makes any user from a client sign up. Since migration
# 0038 the hook lets every user be made and records the address in public.invites, so the trigger of 0036 clears the
# password of that sign up. A sign in of a person who has an account makes no user, so the hook never runs for it.
# migrate.py applies the migrations after the stack is up, and the hook is only called on a sign up, which no step of
# local_up makes.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

# The OAuth 2.1 server the connector uses as its authorization server (TECH-010). Supabase sends the person to
# site_url + authorization_url_path + ?authorization_id=<id>. The path is "/" because the hosted planner is a bucket
# behind CloudFront that serves index.html at the root only, and the planner opens its consent page from the query.
# The live project carries the same three settings. The local stack signs with the CLI's ES256 key already.
[auth.oauth_server]
enabled = true
authorization_url_path = "/"
allow_dynamic_registration = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
