AWSTemplateFormatVersion: "2010-09-09"
Description: >
  latam-trip-mcp, the connector Claude uses to read and write the trip data. One Lambda behind an API Gateway HTTP API
  (public Function URLs are blocked in this account), run with the Lambda Web Adapter. Every resource is prefixed
  latam-trip-mcp and tagged project=latam-trip. The Supabase secret key and the sign in passphrase live in SSM under
  /latam-trip-mcp/ and are never in this template.

Parameters:
  LwaLayerArn:
    Type: String
    Description: Lambda Web Adapter layer (x86_64) for this region.
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  SsmKmsKeyArn:
    Type: String
    Description: The account's alias/aws/ssm key, which encrypts the SecureString parameters. deploy.sh resolves it.
    AllowedPattern: "arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]+"

Resources:
  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: latam-trip-mcp-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: project
          Value: latam-trip

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: latam-trip-mcp-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: latam-trip-mcp-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt SessionTable.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/latam-trip-mcp/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref SsmKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - Key: project
          Value: latam-trip

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: latam-trip-mcp
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: run.sh
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt FunctionRole.Arn
      Layers: [!Ref LwaLayerArn]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          PORT: "8080"
          LATAMTRIP_SESSION_TABLE: !Ref SessionTable
          LATAMTRIP_URL_PARAM: /latam-trip-mcp/supabase-url
          LATAMTRIP_KEY_PARAM: /latam-trip-mcp/supabase-secret-key
          LATAMTRIP_PASSPHRASE_PARAM: /latam-trip-mcp/signin-passphrase
          LATAMTRIP_APP_URL: https://d15amu9hjiumbd.cloudfront.net
      Tags:
        - Key: project
          Value: latam-trip

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: latam-trip-mcp-api
      ProtocolType: HTTP
      Tags: { project: latam-trip }

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  RouteDefault:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "$default"
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      Tags: { project: latam-trip }

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  McpEndpoint:
    Value: !Sub ${HttpApi.ApiEndpoint}/mcp
